<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcement Details - CORAL</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">
  <div>
    <nav class="bg-sky-700 text-white shadow-md">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <a href="index.html" class="font-bold text-xl">CORAL</a>
        <a href="index.html" class="text-sm underline">Back to Home</a>
      </div>
    </nav>
    <main class="max-w-3xl mx-auto px-4 py-8">
      <div id="detailCard" class="bg-white p-8 rounded-xl shadow-md border border-slate-200"></div>
    </main>
  </div>
  <footer class="bg-slate-900 text-slate-400 py-6 text-center text-sm">
    <p>&copy; 2026 CORAL Project Team.</p>
  </footer>
  <script src="assets/js/db.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    const items = getAnnouncements();
    const item = items.find(i => i.id === id);
    const container = document.getElementById('detailCard');

    if (item) {
      container.innerHTML = `
        <div class="flex justify-between items-center mb-4">
          <span class="bg-sky-100 text-sky-800 text-xs font-bold uppercase px-3 py-1 rounded">\${item.category.toUpperCase()}</span>
          <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded">\${item.status}</span>
        </div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-4">\${item.title}</h1>
        <div class="bg-slate-50 p-4 rounded-lg text-sm text-slate-700 space-y-2 mb-6 border border-slate-200">
          <p>📍 <strong>Affected Location:</strong> \${item.location}</p>
          <p>🏛️ <strong>Issuing Organization:</strong> \${item.sourceOrg}</p>
          <p>📄 <strong>Source Reference:</strong> \${item.sourceRef || 'N/A'}</p>
          <p>🕒 <strong>Source Issuance Date:</strong> \${item.sourceDate}</p>
          <p>✍️ <strong>Published By Admin:</strong> \${item.admin}</p>
        </div>
        <div class="prose max-w-none text-slate-800 mb-8 leading-relaxed">
          <p>\${item.details}</p>
        </div>
        <div class="border-t pt-4 text-xs text-slate-400">
          <p>Announcement ID: \${item.id} | Last Updated: \${item.updatedDate}</p>
        </div>
      `;
    } else {
      container.innerHTML = `<p class="text-rose-600 font-bold">Announcement not found or removed.</p>`;
    }
  </script>
</body>
</html>
