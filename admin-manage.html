<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Announcement - CORAL</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-100 min-h-screen">
  <nav class="bg-slate-900 text-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <span class="font-bold text-xl">Create Announcement</span>
      <a href="admin-dashboard.html" class="text-sm underline">Back to Dashboard</a>
    </div>
  </nav>
  <main class="max-w-2xl mx-auto px-4 py-8">
    <form onsubmit="handleCreate(event)" class="bg-white p-8 rounded-xl shadow space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Category</label>
        <select id="cat" class="w-full border p-2 rounded-lg text-sm">
          <option value="power">Power Interruption</option>
          <option value="sea">Sea Travel</option>
          <option value="disaster">Disaster Advisory</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Title</label>
        <input type="text" id="title" required class="w-full border p-2 rounded-lg text-sm" placeholder="Title...">
      </div>
      <div>
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Summary</label>
        <textarea id="summary" required class="w-full border p-2 rounded-lg text-sm" rows="2"></textarea>
      </div>
      <div>
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Detailed Information</label>
        <textarea id="details" required class="w-full border p-2 rounded-lg text-sm" rows="4"></textarea>
      </div>
      <div>
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Affected Location</label>
        <input type="text" id="location" required class="w-full border p-2 rounded-lg text-sm" value="Corcuera, Romblon">
      </div>
      <div>
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Source Organization</label>
        <input type="text" id="sourceOrg" required class="w-full border p-2 rounded-lg text-sm" value="ROMELCO / PCG / MDRRMO">
      </div>
      <button type="submit" class="w-full bg-sky-600 text-white font-bold py-3 rounded-lg hover:bg-sky-700">Publish Announcement</button>
    </form>
  </main>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/db.js"></script>
  <script>
    checkAdminAuth();
    function handleCreate(e) {
      e.preventDefault();
      const items = getAnnouncements();
      items.unshift({
        id: "cor-" + Date.now(),
        category: document.getElementById('cat').value,
        title: document.getElementById('title').value,
        summary: document.getElementById('summary').value,
        details: document.getElementById('details').value,
        location: document.getElementById('location').value,
        status: "Active",
        sourceOrg: document.getElementById('sourceOrg').value,
        sourceRef: "Official Notice",
        sourceDate: new Date().toISOString().replace('T', ' ').substring(0, 16),
        pubDate: new Date().toISOString().replace('T', ' ').substring(0, 16),
        updatedDate: new Date().toISOString().replace('T', ' ').substring(0, 16),
        admin: "Admin"
      });
      saveAnnouncements(items);
      alert("Published successfully!");
      window.location.href = "admin-dashboard.html";
    }
  </script>
</body>
</html>
