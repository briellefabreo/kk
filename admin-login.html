<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - CORAL</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white max-w-md w-full p-8 rounded-2xl shadow-xl">
    <div class="text-center mb-6">
      <span class="bg-amber-500 text-slate-900 text-xs font-extrabold px-3 py-1 rounded-full uppercase">Secure Portal</span>
      <h1 class="text-2xl font-extrabold text-slate-900 mt-2">Administrator Login</h1>
      <p class="text-xs text-slate-500 mt-1">Username: <strong>admin@corcuera.gov.ph</strong></p>
      <p class="text-xs text-slate-500">Password: <strong>CoralAdmin2026!</strong></p>
    </div>
    <form onsubmit="event.preventDefault(); adminLogin(document.getElementById('email').value, document.getElementById('pass').value);" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Admin Email</label>
        <input type="text" id="email" required class="w-full border px-3 py-2 rounded-lg text-sm" value="admin@corcuera.gov.ph">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
        <input type="password" id="pass" required class="w-full border px-3 py-2 rounded-lg text-sm" value="CoralAdmin2026!">
      </div>
      <button type="submit" class="w-full bg-sky-700 text-white font-bold py-2.5 rounded-lg hover:bg-sky-800 transition">Secure Sign In</button>
    </form>
    <div class="mt-6 text-center">
      <a href="index.html" class="text-xs text-slate-500 hover:underline">&larr; Return to Public Resident Feed</a>
    </div>
  </div>
  <script src="assets/js/auth.js"></script>
</body>
</html>
